name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci --legacy-peer-deps
      - run: npx expo prebuild --clean --platform android
      - name: Force Gradle 8.6
        run: sed -i 's/gradle-8.8-all.zip/gradle-8.6-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build RELEASE APK offline
        run: |
          cd android
         ./gradlew assembleRelease --no-daemon \
          -Pandroid.injected.signing.store.file=$PWD/app/debug.keystore \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android
      - uses: actions/upload-artifact@v4
        with:
          name: CatchUp-APK
          path: android/app/build/outputs/apk/release/app-release.apk
