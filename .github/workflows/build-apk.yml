name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci --legacy-peer-deps
      - run: npx expo install --fix
      - run: npx expo prebuild --clean --platform android
      - name: Force Gradle 8.6 for SDK 51
        run: |
          sed -i 's/gradle-8.8-all.zip/gradle-8.6-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
      - name: Build Debug APK with Java 17
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: cd android &&./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME
      - uses: actions/upload-artifact@v4
        with:
          name: CatchUp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
